[webHookConfig]
token = ""           # Telegram bot token；也可走环境变量 TOKEN
address = ":8080"    # webhook 本地监听地址
domain = ""          # Telegram 可访问到的 HTTPS 域名，不带 https://
secret = ""          # webhook secret，可留空，由程序自动生成
certFile = ""        # 直连 HTTPS 时使用证书
keyFile = ""

[log]
timeFormat = ""  # 可留空
path = ""        # 留空表示输出到默认位置
level = 0        # zerolog 级别，0 为最低

[ytdlp]
enable = false
path = "" # 默认使用 yt-dlp

[ai]
enable = false
geminiKey = ""
geminiModel = "gemini-2.5-flash"
openaiKey = ""
openaiModel = ""
openaiBaseUrl = ""
fallbackOpenaiKey = ""
fallbackOpenaiModel = ""
fallbackOpenaiBaseUrl = ""

[emotion]
enable = false
apiBaseUrl = "https://emo.whosworld.fun"
apiKey = ""
uploadedFile = "./data/sticker_uploads.json"

[admin]
chatIDs = []


[storage]
enable = false
provider = "sqlite"

[storage.sqlite]
path = "./data"
name = "bot.db"
quotations = "quotations.db"
host = ""      # mysql 时使用
user = ""
password = ""
dbname = ""
charset = ""
